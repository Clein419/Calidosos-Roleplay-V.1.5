name: Discord Commits

on:
  push:
    branches:
      - main

jobs:
  notify:
    runs-on: ubuntu-latest

    steps:
      - name: Send Discord Message
        run: |
          curl -H "Content-Type: application/json" \
          -X POST \
          -d '{
            "content": "**Nuevo commit en el repo**\nAutor: ${{ github.actor }}\nMensaje: ${{ github.event.head_commit.message }}"
          }' \
          https://discord.com/api/webhooks/1505941544484732968/fBpppkno7QOwcEpUQAUuPozDGyHccwfvIAp1ySBAbUqPxJc41FxGa370YiCxz0SL_wgN
